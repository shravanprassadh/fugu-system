[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fugu-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[project.scripts]
fugu-create-user = "fugu.boot.create_user:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/fugu/boot/migrations.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/test_create_user.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
