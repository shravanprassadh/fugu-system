name: Infrastructure Continuous Integration Gate

on:
  push:
    branches: [feature/modular-kernel-core]
  pull_request:
    branches: [main]

jobs:
  scaffold-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code base
        uses: actions/checkout@v4
      - name: Verify topography integrity
        run: |
          test -f backend/pyproject.toml
          test -f backend/requirements.txt
          test -f backend/src/fugu/boot/config.py
          test -f backend/tests/test_config.py
          test -f .env.example

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code base
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Ruff
        run: ruff check src tests
      - name: Run mypy
        run: mypy src
      - name: Run pytest
        run: pytest
