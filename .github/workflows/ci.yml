name: Infrastructure Continuous Integration Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  secret-scan:
    name: Security & Secret Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Reject forbidden tracked files and credential patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          python - <<'PY' | tee ci-artifacts/repository-policy-scan.txt
          from __future__ import annotations

          import pathlib
          import re
          import subprocess
          import sys

          allowed_names = {".env.example"}
          forbidden_names = {
              "credentials.json",
              "service-account.json",
              "id_rsa",
              "id_ed25519",
          }
          forbidden_suffixes = {".key", ".p12", ".pfx", ".pem"}
          secret_patterns = {
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "OpenRouter token": re.compile(r"sk-or-v1-[A-Za-z0-9_-]{20,}"),
              "GitHub token": re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              "AWS access key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "Slack token": re.compile(r"xox[baprs]-[A-Za-z0-9-]{20,}"),
          }

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          findings: list[str] = []

          for raw_path in filter(None, tracked):
              path = pathlib.Path(raw_path)
              name = path.name
              lowered = name.lower()

              if name not in allowed_names:
                  if lowered == ".env" or lowered.startswith(".env."):
                      findings.append(f"forbidden environment file: {raw_path}")
                  if lowered in forbidden_names or path.suffix.lower() in forbidden_suffixes:
                      findings.append(f"forbidden credential file: {raw_path}")

              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              for label, pattern in secret_patterns.items():
                  if pattern.search(text):
                      findings.append(f"{label} pattern detected in {raw_path}")

          if findings:
              print("Repository policy violations detected:")
              for finding in sorted(set(findings)):
                  print(f"- {finding}")
              sys.exit(1)

          print(f"Repository policy scan passed for {len(list(filter(None, tracked)))} tracked files.")
          PY

      - name: Scan changed commit history with TruffleHog
        uses: trufflesecurity/trufflehog@f446421baf832d6356c42c1743d99abff52ff334 # v3.95.7
        with:
          path: ./
          version: "3.95.7"
          extra_args: --only-verified

      - name: Upload secret-scan diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-diagnostics
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

  backend-validation:
    name: Backend Lint, Type Check, Tests & Audit
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Initialize Python 3.11.11 runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt

      - name: Initialize backend diagnostic directory
        run: mkdir -p ci-artifacts

      - name: Install pinned backend dependencies and audit tooling
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade "pip==26.1.1" 2>&1 | tee ci-artifacts/pip-bootstrap.log
          python -m pip install -r requirements.txt "pip-audit==2.10.1" 2>&1 | tee ci-artifacts/dependency-install.log

      - name: Verify Ruff formatting
        shell: bash
        run: |
          set -o pipefail
          python -m ruff format --check src tests 2>&1 | tee ci-artifacts/ruff-format.log

      - name: Execute Ruff static linting
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check src tests 2>&1 | tee ci-artifacts/ruff-lint.log

      - name: Enforce strict Mypy typing
        shell: bash
        run: |
          set -o pipefail
          python -m mypy src 2>&1 | tee ci-artifacts/mypy.log

      - name: Run asynchronous Pytest suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --junitxml=ci-artifacts/pytest-results.xml 2>&1 | tee ci-artifacts/pytest.log

      - name: Audit Python dependency graph
        shell: bash
        run: |
          set -o pipefail
          python -m pip_audit \
            --requirement requirements.txt \
            --strict \
            --progress-spinner off \
            --format json \
            --output ci-artifacts/pip-audit.json \
            2>&1 | tee ci-artifacts/pip-audit.log

      - name: Upload backend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-diagnostic-logs
          path: |
            backend/ci-artifacts/
            backend/.mypy_cache/
            backend/.pytest_cache/
          if-no-files-found: warn
          retention-days: 7

  frontend-validation:
    name: Frontend Lint, Tests, Build & Audit
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Initialize Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Initialize frontend diagnostic directory
        run: mkdir -p ci-artifacts

      - name: Enforce lockfile-backed installation
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci-artifacts/npm-ci.log

      - name: Run ESLint static analysis
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ci-artifacts/eslint.log

      - name: Run Vitest integration suites with JUnit output
        shell: bash
        run: |
          set -o pipefail
          npm exec vitest -- run \
            --reporter=default \
            --reporter=junit \
            --outputFile=ci-artifacts/vitest-report.xml \
            2>&1 | tee ci-artifacts/vitest.log

      - name: Audit npm dependency graph at high severity
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high --json 2>&1 | tee ci-artifacts/npm-audit.json

      - name: Verify production-optimized Next.js build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-artifacts/next-build.log

      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-diagnostic-logs
          path: |
            frontend/ci-artifacts/
            frontend/.next/trace
            frontend/.next/build-manifest.json
          if-no-files-found: warn
          retention-days: 7

  browser-smoke-validation:
    name: Browser End-to-End Smoke Tests
    runs-on: ubuntu-latest
    needs: frontend-validation
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Initialize Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright runner
        env:
          PLAYWRIGHT_VERSION: "1.55.0"
        run: npm install --no-save --no-package-lock --ignore-scripts "@playwright/test@${PLAYWRIGHT_VERSION}"

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run core product smoke journey
        run: npm run test:e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  production-validation:
    name: Production Container & Runtime Validation
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - backend-validation
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate entrypoint shell syntax
        run: bash -n backend/entrypoint.sh

      - name: Build non-root production backend image
        run: docker build --file backend/Dockerfile --tag fugu-backend:ci backend

      - name: Verify container user and runtime-only dependency surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect fugu-backend:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint /bin/bash fugu-backend:ci -n /app/entrypoint.sh
          docker run --rm --entrypoint python fugu-backend:ci -c \
            "import importlib.util; import fugu.main; assert importlib.util.find_spec('pytest') is None"

  required-gate:
    name: Required CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secret-scan
      - backend-validation
      - frontend-validation
      - browser-smoke-validation
      - production-validation
    steps:
      - name: Enforce all validation outcomes
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          BACKEND_RESULT: ${{ needs.backend-validation.result }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}
          BROWSER_SMOKE_RESULT: ${{ needs.browser-smoke-validation.result }}
          PRODUCTION_RESULT: ${{ needs.production-validation.result }}
        run: |
          set -euo pipefail
          printf 'secret-scan=%s\nbackend-validation=%s\nfrontend-validation=%s\nbrowser-smoke-validation=%s\nproduction-validation=%s\n' \
            "$SECRET_SCAN_RESULT" \
            "$BACKEND_RESULT" \
            "$FRONTEND_RESULT" \
            "$BROWSER_SMOKE_RESULT" \
            "$PRODUCTION_RESULT"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$BROWSER_SMOKE_RESULT" = "success"
          test "$PRODUCTION_RESULT" = "success"
