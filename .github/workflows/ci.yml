name: Infrastructure Continuous Integration Gate

on:
  push:
    branches: [feature/modular-kernel-core]
  pull_request:
    branches: [main]

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  scaffold-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code base
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Verify topography integrity
        run: |
          test -f backend/pyproject.toml
          test -f backend/requirements.txt
          test -f backend/src/fugu/boot/config.py
          test -f backend/src/fugu/database/connection.py
          test -f backend/src/fugu/database/models.py
          test -f backend/src/fugu/security/auth.py
          test -f backend/src/fugu/security/encryption.py
          test -f backend/src/fugu/api/dependencies.py
          test -f backend/src/fugu/api/routes/auth.py
          test -f backend/src/fugu/api/routes/execution.py
          test -f backend/src/fugu/providers/base.py
          test -f backend/src/fugu/providers/exceptions.py
          test -f backend/src/fugu/providers/registry.py
          test -f backend/src/fugu/providers/openrouter.py
          test -f backend/src/fugu/execution/exceptions.py
          test -f backend/src/fugu/execution/models.py
          test -f backend/src/fugu/execution/graph.py
          test -f backend/src/fugu/execution/kernel.py
          test -f backend/alembic/versions/0001_initial_schema.py
          test -f backend/alembic/versions/0002_user_token_version.py
          test -f backend/alembic/versions/0003_pipeline_step_run_identity.py
          test -f backend/tests/test_config.py
          test -f backend/tests/test_database.py
          test -f backend/tests/test_security.py
          test -f backend/tests/test_providers.py
          test -f backend/tests/test_execution.py
          test -f .env.example

  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code base
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Run Ruff
        run: ruff check src tests
      - name: Run pytest
        run: pytest

  backend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code base
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Run mypy
        run: mypy src
