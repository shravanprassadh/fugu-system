name: One-time Production Formatter

on:
  push:
    branches:
      - feature/modular-kernel-core

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-production]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/modular-kernel-core
          fetch-depth: 0
          show-progress: false

      - name: Initialize Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Apply pinned Ruff formatter
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.4.10"
          python -m ruff format \
            backend/src/fugu/boot/config.py \
            backend/src/fugu/boot/migrations.py \
            backend/src/fugu/main.py \
            backend/tests/test_production.py

      - name: Commit formatting changes
        run: |
          if [ -z "$(git status --porcelain -- backend/src backend/tests)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/fugu/boot/config.py \
            backend/src/fugu/boot/migrations.py \
            backend/src/fugu/main.py \
            backend/tests/test_production.py
          git commit -m "style: format production runtime files [format-production]"
          git push origin HEAD:feature/modular-kernel-core

