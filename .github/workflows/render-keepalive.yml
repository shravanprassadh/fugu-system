name: Render Keepalive

on:
  schedule:
    # Render Free web services spin down after 15 minutes without inbound traffic.
    # This conservative 10-minute ping keeps the backend warm while staying below
    # the monthly free instance-hours budget for a single service.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping-render-backend:
    name: Ping Render backend
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          BACKEND_HEALTH_URL: https://fugu-system.onrender.com/api/health/live
        run: |
          curl --fail --silent --show-error \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 20 \
            "$BACKEND_HEALTH_URL"
