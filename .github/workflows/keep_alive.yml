name: Infrastructure Permanent Keep-Alive Cron

on:
  schedule:
    # Executes automatically every Sunday at midnight (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows a manual trigger button within the GitHub UI

jobs:
  ping-infrastructure-grid:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clone Code Repository Core
      uses: actions/checkout@v4

    - name: Initialize Isolated Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Relational Database Network Drivers
      run: |
        pip install --upgrade pip
        pip install psycopg2-binary

    - name: Execute Coordinated Cloud Handshake Loop
      env:
        MASTER_ROUTER_DB_URL: ${{ secrets.MASTER_ROUTER_DB_URL }}
      run: python heartbeat.py
