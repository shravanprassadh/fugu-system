name: Temporary Ruff Format Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.11"
      - name: Render exact Ruff output
        working-directory: backend
        run: |
          python -m pip install "ruff==0.4.10"
          python -m ruff format src/fugu/production_baseline.py
          printf '%s\n' '---FORMATTED-FILE-START---'
          cat src/fugu/production_baseline.py
          printf '%s\n' '---FORMATTED-FILE-END---'
