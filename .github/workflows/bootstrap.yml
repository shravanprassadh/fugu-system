name: Bootstrap Fugu Runtime Data

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider adapter name
        required: true
        default: openrouter
      model:
        description: Provider model identifier
        required: true
      replace_pipeline:
        description: Replace existing active pipeline definition
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: bootstrap-fugu-runtime-data
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Seed pipeline and provider credential
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MASTER_ROUTER_DB_URL: ${{ secrets.MASTER_ROUTER_DB_URL }}
      METADATA_SIDEBAR_DB_URL: ${{ secrets.METADATA_SIDEBAR_DB_URL || secrets.MASTER_ROUTER_DB_URL }}
      TRANSACTIONAL_LOGS_DB_URL: ${{ secrets.TRANSACTIONAL_LOGS_DB_URL || secrets.MASTER_ROUTER_DB_URL }}
      VAULT_ENCRYPTION_KEY: ${{ secrets.VAULT_ENCRYPTION_KEY }}
      FUGU_PROVIDER_SECRET: ${{ secrets.FUGU_PROVIDER_SECRET }}
      RUNTIME_ENVIRONMENT: production
      RUN_MIGRATIONS: "false"
      VERIFY_DATABASES_ON_STARTUP: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Initialize Python 3.11.11 runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/requirements.txt

      - name: Validate required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in MASTER_ROUTER_DB_URL VAULT_ENCRYPTION_KEY FUGU_PROVIDER_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              missing=1
            fi
          done
          test "$missing" = "0"

      - name: Install runtime package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==26.1.1"
          python -m pip install --requirement requirements-runtime.txt
          python -m pip install --no-deps .

      - name: Seed execution pipeline
        shell: bash
        run: |
          set -euo pipefail
          replace_flag=""
          if [ "${{ inputs.replace_pipeline }}" = "true" ]; then
            replace_flag="--replace"
          fi
          fugu-seed-pipeline \
            --provider "${{ inputs.provider }}" \
            --model "${{ inputs.model }}" \
            $replace_flag

      - name: Store encrypted provider credential
        shell: bash
        run: |
          set -euo pipefail
          fugu-set-provider-credential --provider "${{ inputs.provider }}"
