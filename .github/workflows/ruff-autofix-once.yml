name: One-time Ruff Autofix

on:
  push:
    branches:
      - feature/modular-kernel-core
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message || '', '[ruff-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/modular-kernel-core
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Apply repository Ruff rules
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.4.10"
          python -m ruff check src/fugu/main.py tests/test_production.py --fix
          python -m ruff format src/fugu/main.py tests/test_production.py
          python -m ruff check src/fugu/main.py tests/test_production.py

      - name: Commit mechanical fixes
        run: |
          if [ -z "$(git status --porcelain -- backend/src/fugu/main.py backend/tests/test_production.py)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/fugu/main.py backend/tests/test_production.py
          git commit -m "style: apply Ruff import fixes [ruff-autofix]"
          git push origin HEAD:feature/modular-kernel-core
