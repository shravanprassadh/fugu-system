services:
  - type: web
    name: fugu-backend
    runtime: python
    rootDir: backend
    buildCommand: >-
      python -m pip install --upgrade "pip==26.1.1" &&
      python -m pip install --requirement requirements-runtime.txt &&
      python -m pip install --no-deps .
    startCommand: bash ./entrypoint.sh
    healthCheckPath: /api/health/live
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: RUNTIME_ENVIRONMENT
        value: production
      - key: WEB_WORKERS_COUNT
        value: 1
      - key: RUN_MIGRATIONS
        value: true
      - key: VERIFY_DATABASES_ON_STARTUP
        value: true
      - key: MASTER_ROUTER_DB_URL
        sync: false
      - key: METADATA_SIDEBAR_DB_URL
        sync: false
      - key: TRANSACTIONAL_LOGS_DB_URL
        sync: false
      - key: SYSTEM_SESSION_SECRET
        sync: false
      - key: VAULT_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
